services:
  mysql:
    image: mysql:8.4
    container_name: cyberrag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cyberrag_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cyber_rag}
      MYSQL_USER: ${MYSQL_USER:-cyberrag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cyberrag_pass}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"   # 仅本机可访问, 不暴露公网
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-cyberrag_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [cyberrag]

  rag:
    build: ./rag-service
    container_name: cyberrag-rag
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change-me-internal-token}
      # LLM: 与 .env.example / app/core/config.py 默认保持一致
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      # Embedding: 默认本地 BGE(与 README/.env.example/Settings 默认一致);
      # 切换远程 API 时设 EMBEDDING_PROVIDER=openai 并配置 EMBEDDING_* 三项
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      RAG_RETRIEVAL_STRATEGY: ${RAG_RETRIEVAL_STRATEGY:-vector}
      # ---- Security-Aware Adaptive RAG(第四轮; 详见 .env.example) ----
      ADAPTIVE_ENABLED: ${ADAPTIVE_ENABLED:-false}
      ENTITY_BOOST_ENABLED: ${ENTITY_BOOST_ENABLED:-true}
      RERANK_CONFIDENCE_THRESHOLD: ${RERANK_CONFIDENCE_THRESHOLD:-0.75}
      RERANK_SCORE_MARGIN_THRESHOLD: ${RERANK_SCORE_MARGIN_THRESHOLD:-0.08}
      RERANK_AGREEMENT_THRESHOLD: ${RERANK_AGREEMENT_THRESHOLD:-0.6}
      COMPLEXITY_THRESHOLD: ${COMPLEXITY_THRESHOLD:-7.5}
      FAST_PATH_TOP1_MIN: ${FAST_PATH_TOP1_MIN:-0.55}
      FAST_PATH_MARGIN_MIN: ${FAST_PATH_MARGIN_MIN:-0.015}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-3000}
      MIN_CONTEXT_CHUNKS: ${MIN_CONTEXT_CHUNKS:-2}
      MAX_CONTEXT_CHUNKS: ${MAX_CONTEXT_CHUNKS:-6}
      PARENT_CHUNK_SIZE: ${PARENT_CHUNK_SIZE:-1024}
      CHILD_CHUNK_SIZE: ${CHILD_CHUNK_SIZE:-320}
      CHILD_CHUNK_OVERLAP: ${CHILD_CHUNK_OVERLAP:-60}
      EMBEDDING_CACHE_SIZE: ${EMBEDDING_CACHE_SIZE:-512}
      RETRIEVAL_CACHE_SIZE: ${RETRIEVAL_CACHE_SIZE:-256}
      WARMUP_ENABLED: ${WARMUP_ENABLED:-true}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      # 国内网络可设 HF_ENDPOINT=https://hf-mirror.com 加速模型下载
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - chroma-data:/app/data/chroma
      - rag-models:/app/models_cache
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [cyberrag]

  backend:
    build: ./backend
    container_name: cyberrag-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rag:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cyber_rag}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cyberrag}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cyberrag_pass}
      APP_JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-min-32-bytes!!}
      APP_RAG_BASE_URL: http://rag:8000
      APP_RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change-me-internal-token}
      APP_UPLOAD_MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    networks: [cyberrag]

  frontend:
    build: ./frontend
    container_name: cyberrag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks: [cyberrag]

volumes:
  mysql-data:
  chroma-data:
  rag-models:
  uploads-data:

networks:
  cyberrag:
    driver: bridge
